name: 'Reset Supabase Database'
description: 'Clean an Supabase database and reset it to a blank state'
inputs:
  connectionString:  # id of input
    description: 'e.g. postgres://user:password@host:5432/database'
    required: true
  users:  # id of input
    description: 'List if user emails to delete e.g. test@test.com,test2@test.com. Ignored if deleteAllUsers is true.'
    required: false
  deleteAllUsers:  # id of input
    description: 'If true, delete every row in auth.users instead of using the users list. For seed-managed environments with no real end users (dev/staging) — avoids auth.users accumulating orphaned rows (e.g. from NULL-email phone logins) that the named list can never target.'
    required: false
    default: 'false'
  buckets:  # id of input
    description: 'List of buckets to delete e.g. public,content'
    required: false
  supabaseUrl:  # id of input
    description: 'Supabase project URL, required to delete buckets via the Storage API e.g. https://xyz.supabase.co'
    required: false
  serviceRoleKey:  # id of input
    description: 'Supabase service role key, required to delete buckets via the Storage API'
    required: false
  extensions:  # id of input
    description: 'List of extensions to disable e.g. content-lib,welcome'
    required: false
  schemas:  # id of input
    description: 'List of additional schemas to drop e.g. audit,custom'
    required: false
runs:
  using: 'node16'
  main: 'dist/index.js'
